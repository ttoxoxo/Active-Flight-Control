[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
monitor_speed = 9600

lib_deps =
    sparkfun/SparkFun u-blox GNSS v3@^3.1.9
    sparkfun/SparkFun Qwiic 6Dof - LSM6DSO@^1.0.2

    ## All 3 needed for BMP280 altimeter
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

    ## Radio
    xreef/EByte LoRa E32 library@^1.5.13

    ## Potential Magnetometer for yaw drift
    sparkfun/SparkFun MMC5983MA Magnetometer@^1.0.4
